name: backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - supabase/**
      - docs/api/**
      # The client contract fixtures are checked against live responses by the backend tests.
      - packages/taketuk_api/test/fixtures/**
      - .nvmrc
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - backend/**
      - supabase/**
      - docs/api/**
      # The client contract fixtures are checked against live responses by the backend tests.
      - packages/taketuk_api/test/fixtures/**
      - .nvmrc
      - .github/workflows/backend.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL + PostGIS for integration tests (ADR-0003: migrations apply to plain PostgreSQL).
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests (unit, architecture, OpenAPI drift, integration against PostGIS)
        run: npm test
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
